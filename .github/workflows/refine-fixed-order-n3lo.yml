name: Refine fixed-order N3LO distinction

on:
  push:
    branches:
      - main
    paths:
      - '.github/run-refine-fixed-order-n3lo'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine fixed-order discussion
        run: python3 .github/refine_fixed_order_n3lo.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add main.tex
          git commit -m 'Clarify fixed-order N3LO slicing layers'
          git push origin HEAD:main
