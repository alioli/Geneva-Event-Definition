name: Push changes to Overleaf

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: overleaf-sync
  cancel-in-progress: false

env:
  OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
  OVERLEAF_REMOTE: https://git@git.overleaf.com/69ce2c30f9afe0bef5ae7ddf

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out GitHub history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark sync pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=overleaf-sync \
            -f description='Syncing changes to Overleaf' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Configure Overleaf authentication
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OVERLEAF_TOKEN:-}" ]]; then
            echo "::error::Repository secret OVERLEAF_TOKEN is not configured."
            exit 1
          fi

          ASKPASS="$RUNNER_TEMP/overleaf-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'git' ;;
            *Password*) printf '%s\n' "$OVERLEAF_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          echo "GIT_ASKPASS=$ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Build the GitHub change patch
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Apply only the changes introduced by this GitHub push. The
          # workflow itself is deliberately excluded from the Overleaf tree.
          git diff --binary "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude).github/**' \
            > "$RUNNER_TEMP/github-to-overleaf.patch"

          if [[ ! -s "$RUNNER_TEMP/github-to-overleaf.patch" ]]; then
            echo "No project-file changes to send to Overleaf."
          fi

      - name: Fetch Overleaf first and apply the GitHub changes
        shell: bash
        run: |
          set -euo pipefail

          git remote add overleaf "$OVERLEAF_REMOTE"

          OVERLEAF_BRANCH="$({ git ls-remote --symref overleaf HEAD || true; } \
            | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')"

          if [[ -z "$OVERLEAF_BRANCH" ]]; then
            echo "::error::Could not determine the default branch of the Overleaf repository."
            exit 1
          fi

          echo "Using Overleaf branch: $OVERLEAF_BRANCH"
          git fetch --prune overleaf "$OVERLEAF_BRANCH"

          # Work on top of the current Overleaf branch, not on top of the
          # possibly stale GitHub copy. This preserves edits made directly
          # in Overleaf.
          git switch --detach "overleaf/$OVERLEAF_BRANCH"

          PATCH="$RUNNER_TEMP/github-to-overleaf.patch"
          if [[ ! -s "$PATCH" ]]; then
            exit 0
          fi

          # --3way uses the GitHub pre-push blobs as the merge base. If the
          # same lines were edited independently in Overleaf, the job fails
          # with a conflict instead of overwriting either version.
          if ! git apply --3way --index "$PATCH"; then
            echo "::error::The GitHub changes conflict with edits already present in Overleaf. Nothing was pushed."
            git status --short
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Overleaf already contains these changes."
            exit 0
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "Sync GitHub changes ${GITHUB_SHA::12}"
          git push overleaf "HEAD:$OVERLEAF_BRANCH"

      - name: Mark sync successful
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=overleaf-sync \
            -f description='Changes synced to Overleaf' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Mark sync failed
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=overleaf-sync \
            -f description='Overleaf sync failed; nothing was pushed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
