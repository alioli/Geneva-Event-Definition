name: Add document outline

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-outline.yml'

permissions:
  contents: write

concurrency:
  group: overleaf-sync
  cancel-in-progress: false

env:
  OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
  OVERLEAF_REMOTE: https://git@git.overleaf.com/69ce2c30f9afe0bef5ae7ddf
  STATE_FILE: .github/overleaf-sync-state

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Overleaf authentication
        shell: bash
        run: |
          set -euo pipefail
          ASKPASS="$RUNNER_TEMP/overleaf-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'git' ;;
            *Password*) printf '%s\n' "$OVERLEAF_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          echo "GIT_ASKPASS=$ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Pull current Overleaf state first
        shell: bash
        run: |
          set -euo pipefail
          git remote add overleaf "$OVERLEAF_REMOTE"
          OVERLEAF_BRANCH="$({ git ls-remote --symref overleaf HEAD || true; } | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')"
          test -n "$OVERLEAF_BRANCH"
          git fetch --prune overleaf "$OVERLEAF_BRANCH"
          OVERLEAF_HEAD="$(git rev-parse "overleaf/$OVERLEAF_BRANCH")"
          BASE_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"
          if ! git merge-base --is-ancestor "$BASE_SHA" "$OVERLEAF_HEAD"; then
            echo "::error::Overleaf history does not descend from stored checkpoint."
            exit 1
          fi
          PATCH="$RUNNER_TEMP/overleaf-to-github.patch"
          : > "$PATCH"
          if [[ "$BASE_SHA" != "$OVERLEAF_HEAD" ]]; then
            git diff --binary "$BASE_SHA" "$OVERLEAF_HEAD" -- . ':(exclude).github/**' > "$PATCH"
          fi
          if [[ -s "$PATCH" ]]; then
            git apply --3way --index "$PATCH"
          fi
          printf '%s\n' "$OVERLEAF_HEAD" > "$STATE_FILE"
          git add "$STATE_FILE"
          if ! git diff --cached --quiet; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git commit -m "Sync changes from Overleaf"
            git push origin HEAD:main
          fi

      - name: Add automatic section/subsection outline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('main.tex')
          t = p.read_text()
          if r'\tableofcontents' in t:
              raise SystemExit('Outline already present')
          marker = '\\maketitle\n'
          if t.count(marker) != 1:
              raise SystemExit('Could not locate unique \\maketitle')
          outline = r'''

\renewcommand{\contentsname}{Outline}
\setcounter{tocdepth}{2}
\tableofcontents
\clearpage
'''
          t = t.replace(marker, marker + outline, 1)
          p.write_text(t)
          PY
          git add main.tex
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "Add section and subsection outline"
          git push origin HEAD:main
