name: Simplify lower-resolution notation

on:
  push:
    branches:
      - main
    paths:
      - '.github/run-simplify-rnm'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simplify rN-1 notation in lower-map section
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('main.tex')
          t = p.read_text()

          start_marker = r'\section{Lower-map locality and nested consistency before NNLO observables}'
          end_marker = r'\section{From local projection effects to NNLO differential predictions}'
          if t.count(start_marker) != 1 or t.count(end_marker) != 1:
              raise SystemExit('lower-map section markers not found uniquely')

          i = t.index(start_marker)
          j = t.index(end_marker, i)
          before, block, after = t[:i], t[i:j], t[j:]

          old_intro = '''Let $\\rnm^{(N+1)}(\\Ph_{N+1})$ denote the extension of the lower resolution variable to the
$(N+1)$-parton configuration and define the displacement generated by the lower projection with the same
exact-minus-projected convention used above,'''
          new_intro = '''For an $(N+1)$-parton configuration, define the displacement generated by the lower projection with the same
exact-minus-projected convention used above,'''
          if block.count(old_intro) != 1:
              raise SystemExit('Eq. 60 introductory sentence not found uniquely')
          block = block.replace(old_intro, new_intro, 1)

          n = block.count(r'\rnm^{(N+1)}(\Ph_{N+1})')
          if n < 1:
              raise SystemExit('no remaining rN-1^(N+1) occurrences found in lower-map section')
          block = block.replace(r'\rnm^{(N+1)}(\Ph_{N+1})', r'\rnm(\Ph_{N+1})')

          # Guard against leaving the redundant multiplicity superscript in this section.
          if r'\rnm^{(N+1)}' in block:
              raise SystemExit('a redundant rN-1^(N+1) occurrence remains in lower-map section')

          p.write_text(before + block + after)
          print(f'Removed {n+1} redundant multiplicity annotations including the introductory definition.')
          PY

      - name: Commit edit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- main.tex; then
            echo 'No changes produced.'
            exit 1
          fi
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add main.tex
          git commit -m 'Simplify lower-resolution notation'
          git push origin HEAD:main
