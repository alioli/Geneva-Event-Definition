name: Fresh Overleaf before rewrite

on:
  push:
    branches:
      - main
    paths:
      - '.github/run-fresh-overleaf-before-rewrite'

permissions:
  contents: write

concurrency:
  group: overleaf-sync
  cancel-in-progress: false

env:
  OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
  OVERLEAF_REMOTE: https://git@git.overleaf.com/69ce2c30f9afe0bef5ae7ddf
  STATE_FILE: .github/overleaf-sync-state

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Overleaf authentication
        shell: bash
        run: |
          set -euo pipefail
          ASKPASS="$RUNNER_TEMP/overleaf-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'git' ;;
            *Password*) printf '%s\n' "$OVERLEAF_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          echo "GIT_ASKPASS=$ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
      - name: Fetch and apply current Overleaf state
        shell: bash
        run: |
          set -euo pipefail
          git remote add overleaf "$OVERLEAF_REMOTE"
          BRANCH="$({ git ls-remote --symref overleaf HEAD || true; } | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')"
          git fetch --prune overleaf "$BRANCH"
          HEAD_OL="$(git rev-parse "overleaf/$BRANCH")"
          BASE_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"
          echo "Current Overleaf commit: $HEAD_OL"
          PATCH="$RUNNER_TEMP/overleaf.patch"
          : > "$PATCH"
          if [[ "$BASE_SHA" != "$HEAD_OL" ]]; then
            git diff --binary "$BASE_SHA" "$HEAD_OL" -- . ':(exclude).github/**' > "$PATCH"
          fi
          if [[ -s "$PATCH" ]]; then
            git apply --3way --index "$PATCH"
          fi
          printf '%s\n' "$HEAD_OL" > "$STATE_FILE"
          git add "$STATE_FILE"
          if git diff --cached --quiet; then
            echo 'GitHub is already synchronized with Overleaf.'
            exit 0
          fi
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git commit -m 'Sync changes from Overleaf'
          git push origin HEAD:main
