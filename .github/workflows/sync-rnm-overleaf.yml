name: Sync notation cleanup to Overleaf

on:
  push:
    branches:
      - main
    paths:
      - '.github/run-sync-rnm-overleaf'

permissions:
  contents: read

env:
  OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
  OVERLEAF_REMOTE: https://git@git.overleaf.com/69ce2c30f9afe0bef5ae7ddf

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Overleaf authentication
        shell: bash
        run: |
          set -euo pipefail
          ASKPASS="$RUNNER_TEMP/overleaf-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'git' ;;
            *Password*) printf '%s\n' "$OVERLEAF_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          echo "GIT_ASKPASS=$ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Sync main.tex onto current Overleaf history
        shell: bash
        run: |
          set -euo pipefail
          git remote add overleaf "$OVERLEAF_REMOTE"
          OVERLEAF_BRANCH="$({ git ls-remote --symref overleaf HEAD || true; } | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')"
          test -n "$OVERLEAF_BRANCH"
          git fetch overleaf "$OVERLEAF_BRANCH"
          OVERLEAF_HEAD="$(git rev-parse "overleaf/$OVERLEAF_BRANCH")"
          GITHUB_MAIN_TEX="$RUNNER_TEMP/main-from-github.tex"
          git show HEAD:main.tex > "$GITHUB_MAIN_TEX"
          git checkout -b overleaf-sync-work "$OVERLEAF_HEAD"
          cp "$GITHUB_MAIN_TEX" main.tex
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add main.tex
          if git diff --cached --quiet; then
            echo 'Overleaf already has the current main.tex.'
            exit 0
          fi
          git commit -m 'Sync lower-resolution notation cleanup'
          git push overleaf HEAD:"$OVERLEAF_BRANCH"
