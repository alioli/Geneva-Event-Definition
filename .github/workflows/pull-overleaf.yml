name: Pull changes from Overleaf

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pull-overleaf.yml'

permissions:
  contents: write

concurrency:
  group: overleaf-sync
  cancel-in-progress: false

env:
  OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
  OVERLEAF_REMOTE: https://git@git.overleaf.com/69ce2c30f9afe0bef5ae7ddf
  STATE_FILE: .github/overleaf-sync-state

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out GitHub main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Overleaf authentication
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OVERLEAF_TOKEN:-}" ]]; then
            echo "::error::Repository secret OVERLEAF_TOKEN is not configured."
            exit 1
          fi

          ASKPASS="$RUNNER_TEMP/overleaf-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'git' ;;
            *Password*) printf '%s\n' "$OVERLEAF_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          echo "GIT_ASKPASS=$ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Fetch current Overleaf state
        shell: bash
        run: |
          set -euo pipefail

          git remote add overleaf "$OVERLEAF_REMOTE"

          OVERLEAF_BRANCH="$({ git ls-remote --symref overleaf HEAD || true; } \
            | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')"

          if [[ -z "$OVERLEAF_BRANCH" ]]; then
            echo "::error::Could not determine the default branch of the Overleaf repository."
            exit 1
          fi

          git fetch --prune overleaf "$OVERLEAF_BRANCH"
          OVERLEAF_HEAD="$(git rev-parse "overleaf/$OVERLEAF_BRANCH")"

          echo "Using Overleaf branch: $OVERLEAF_BRANCH"
          echo "Current Overleaf commit: $OVERLEAF_HEAD"
          echo "OVERLEAF_BRANCH=$OVERLEAF_BRANCH" >> "$GITHUB_ENV"
          echo "OVERLEAF_HEAD=$OVERLEAF_HEAD" >> "$GITHUB_ENV"

      - name: Build Overleaf change patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/overleaf-to-github.patch"
          : > "$PATCH"

          if [[ -f "$STATE_FILE" ]]; then
            BASE_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"

            if [[ -z "$BASE_SHA" ]]; then
              echo "::error::The Overleaf sync checkpoint is empty."
              exit 1
            fi

            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "::error::The previous Overleaf checkpoint $BASE_SHA is not available in the fetched history."
              exit 1
            fi

            if ! git merge-base --is-ancestor "$BASE_SHA" "$OVERLEAF_HEAD"; then
              echo "::error::Overleaf history no longer descends from the stored checkpoint. Refusing to overwrite GitHub."
              exit 1
            fi

            if [[ "$BASE_SHA" != "$OVERLEAF_HEAD" ]]; then
              git diff --binary "$BASE_SHA" "$OVERLEAF_HEAD" -- . ':(exclude).github/**' > "$PATCH"
            fi
          else
            echo "No previous Overleaf checkpoint found; bootstrapping from the current trees."
            git diff --binary HEAD "$OVERLEAF_HEAD" -- . ':(exclude).github/**' > "$PATCH"
          fi

          if [[ ! -s "$PATCH" ]]; then
            echo "No project-file changes to import from Overleaf."
          fi

      - name: Apply Overleaf changes safely
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/overleaf-to-github.patch"

          if [[ -s "$PATCH" ]]; then
            if ! git apply --3way --index "$PATCH"; then
              echo "::error::Overleaf changes conflict with current GitHub main. Nothing was pushed to GitHub."
              git status --short
              exit 1
            fi
          fi

          mkdir -p "$(dirname "$STATE_FILE")"
          printf '%s\n' "$OVERLEAF_HEAD" > "$STATE_FILE"
          git add "$STATE_FILE"

          if ! git diff --cached --quiet; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git commit -m "Sync changes from Overleaf"
            git push origin HEAD:main
          else
            echo "GitHub is already synchronized with Overleaf."
          fi

      - name: Refine Z+1-jet mapping comparison
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path
          p = Path('main.tex')
          text = p.read_text()

          if 'eq:z1j-generation-cut' in text:
              raise SystemExit(0)

          anchor = r'''At larger $m_T^Z$ the ratio in Eq.~\eqref{eq:z1j-cut-ratio} decreases and the higher cut enforces a progressively
stronger restriction on $z$ already near the lower boundary.
'''
          insert = anchor + r'''
The event sample is defined with the generation cut
\begin{equation}
q_T>q_T^{\rm gen}=10^{-3}\ {\rm GeV}.
\label{eq:z1j-generation-cut}
\end{equation}
This boundary is exactly preserved by both the FKS and the $\mathcal T_1^{\rm FR}$ projections considered
here. Hence
\begin{equation}
\Theta\!\left(q_T(\widehat\Ph_2)-q_T^{\rm gen}\right)
=
\Theta\!\left(q_T(\Ph_3)-q_T^{\rm gen}\right)
\label{eq:z1j-generation-cut-preserved}
\end{equation}
for the projected events, and the observed LHE differences cannot be attributed to migration across the
process-defining generation boundary. In particular, the non-preservation of $\mathcal T_0$ is relevant here
as a diagnostic of motion along the limiting one-jet Born manifold, not as a generation-cut migration.
'''
          if anchor not in text:
              raise SystemExit('Cut-hierarchy anchor not found')
          text = text.replace(anchor, insert, 1)

          old = r'''This observation is useful when interpreting the numerically large LHE projection effects found in observables
involving the hardest anti-$k_T$ jet, including analyses with $p_{T,j}^{\min}=10$, $50$ and $100$ GeV.
Differences at the level of tens of percent cannot be attributed solely to a parametrically huge ratio of the
technical cuts. They may instead arise from one or a combination of three effects: a genuine failure of
uniform nested locality in tangential one-jet Born coordinates; a nested-local but slowly convergent recoil
map; or amplification of a small kinematic displacement by the steep jet spectrum and the non-smooth
anti-$k_T$ measurement boundaries.
'''
          new = r'''The direct comparison of mappings is particularly informative. With
$\mathcal T_2^{\cut}=10^{-3}\ {\rm GeV}$, the LHE differences obtained with the FKS projection are much smaller,
whereas the $\mathcal T_1^{\rm FR}$ projection still produces substantially larger distortions in observables
involving the hardest anti-$k_T$ jet, including analyses with $p_{T,j}^{\min}=10$, $50$ and $100$ GeV.
For both mappings the differences increase when the higher technical cut is enlarged, and become much larger
for $\mathcal T_2^{\cut}=1\ {\rm GeV}$. The common increase with $\mathcal T_2^{\cut}$ confirms that the effect
is associated with the region represented through the $\Ph_3\to\widehat\Ph_2$ projection. At the same time,
the much smaller residual obtained with FKS at $10^{-3}\ {\rm GeV}$ shows that the large effect seen with the
$\mathcal T_1^{\rm FR}$ map is not an unavoidable consequence of the anti-$k_T$ measurement or of the jet
thresholds themselves: it is strongly map dependent. The jet measurement can still amplify a kinematic
migration, but it cannot by itself explain why two projections with the same generation boundary and the same
analysis behave so differently.

This pattern does not by itself establish a formal failure of uniform nested infrared locality. It is
compatible either with a nested-local $\mathcal T_1^{\rm FR}$ map having a much larger coefficient or a slower
power of convergence than FKS, or with a genuine failure to approach the same point of the limiting $\Ph_1$
manifold along finite-$z$ paths. The comparison with FKS therefore provides an empirical benchmark showing
that the dominant residual is map specific, while a local scaling test is still required to distinguish slow
convergence from a failure of the simultaneous unresolved limit.
'''
          if old not in text:
              raise SystemExit('Observed-effects paragraph not found')
          text = text.replace(old, new, 1)

          old2 = r'''The most direct diagnostic is to apply the competing $\Ph_3\to\Ph_2$ projections, for example an FKS map
and the $\mathcal T_1^{\rm FR}$ map, to the same exact $\Ph_3$ points and study, in bins of
'''
          new2 = r'''Since the inclusive FKS-versus-$\mathcal T_1^{\rm FR}$ comparison is already available, the decisive next
diagnostic is to apply the two projections to the same exact $\Ph_3$ points and study, in bins of
'''
          if old2 not in text:
              raise SystemExit('Diagnostic paragraph not found')
          text = text.replace(old2, new2, 1)
          p.write_text(text)
          PY

          if git diff --quiet -- main.tex; then
            echo "Z+1-jet subsection already up to date."
            exit 0
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add main.tex
          git commit -m "Refine Z+1-jet mapping comparison"
          git push origin HEAD:main
