# one-shot Eq.39 clarification trigger
name: Pull changes from Overleaf

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pull-overleaf.yml'

permissions:
  contents: write

concurrency:
  group: overleaf-sync
  cancel-in-progress: false

env:
  OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
  OVERLEAF_REMOTE: https://git@git.overleaf.com/69ce2c30f9afe0bef5ae7ddf
  STATE_FILE: .github/overleaf-sync-state

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out GitHub main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Overleaf authentication
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OVERLEAF_TOKEN:-}" ]]; then
            echo "::error::Repository secret OVERLEAF_TOKEN is not configured."
            exit 1
          fi

          ASKPASS="$RUNNER_TEMP/overleaf-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'git' ;;
            *Password*) printf '%s\n' "$OVERLEAF_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          echo "GIT_ASKPASS=$ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Fetch current Overleaf state
        shell: bash
        run: |
          set -euo pipefail

          git remote add overleaf "$OVERLEAF_REMOTE"

          OVERLEAF_BRANCH="$({ git ls-remote --symref overleaf HEAD || true; } \
            | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')"

          if [[ -z "$OVERLEAF_BRANCH" ]]; then
            echo "::error::Could not determine the default branch of the Overleaf repository."
            exit 1
          fi

          git fetch --prune overleaf "$OVERLEAF_BRANCH"
          OVERLEAF_HEAD="$(git rev-parse "overleaf/$OVERLEAF_BRANCH")"

          echo "Using Overleaf branch: $OVERLEAF_BRANCH"
          echo "Current Overleaf commit: $OVERLEAF_HEAD"
          echo "OVERLEAF_BRANCH=$OVERLEAF_BRANCH" >> "$GITHUB_ENV"
          echo "OVERLEAF_HEAD=$OVERLEAF_HEAD" >> "$GITHUB_ENV"

      - name: Build Overleaf change patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/overleaf-to-github.patch"
          : > "$PATCH"

          if [[ -f "$STATE_FILE" ]]; then
            BASE_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"

            if [[ -z "$BASE_SHA" ]]; then
              echo "::error::The Overleaf sync checkpoint is empty."
              exit 1
            fi

            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "::error::The previous Overleaf checkpoint $BASE_SHA is not available in the fetched history."
              exit 1
            fi

            if ! git merge-base --is-ancestor "$BASE_SHA" "$OVERLEAF_HEAD"; then
              echo "::error::Overleaf history no longer descends from the stored checkpoint. Refusing to overwrite GitHub."
              exit 1
            fi

            if [[ "$BASE_SHA" != "$OVERLEAF_HEAD" ]]; then
              git diff --binary "$BASE_SHA" "$OVERLEAF_HEAD" -- . ':(exclude).github/**' > "$PATCH"
            fi
          else
            echo "No previous Overleaf checkpoint found; bootstrapping from the current trees."
            git diff --binary HEAD "$OVERLEAF_HEAD" -- . ':(exclude).github/**' > "$PATCH"
          fi

          if [[ ! -s "$PATCH" ]]; then
            echo "No project-file changes to import from Overleaf."
          fi

      - name: Apply Overleaf changes safely
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/overleaf-to-github.patch"

          if [[ -s "$PATCH" ]]; then
            if ! git apply --3way --index "$PATCH"; then
              echo "::error::Overleaf changes conflict with current GitHub main. Nothing was pushed to GitHub."
              git status --short
              exit 1
            fi
          fi

          mkdir -p "$(dirname "$STATE_FILE")"
          printf '%s\n' "$OVERLEAF_HEAD" > "$STATE_FILE"
          git add "$STATE_FILE"

          if ! git diff --cached --quiet; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git commit -m "Sync changes from Overleaf"
            git push origin HEAD:main
          else
            echo "GitHub is already synchronized with Overleaf."
          fi

      - name: Clarify logarithms after Eq. 39
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('main.tex')
          t=p.read_text()
          old=r'''where \(G_i\) denotes the integral over \(z\) and the remaining radiation variables, including \(h_i\), and
\(z_{\max}\) is set jointly by the higher technical cut and the kinematic range. Uniform nested infrared
locality requires the underlying map mismatch to remain uniformly small over any finite allowed range of
\(z\); under the power-like assumption above, \(G_i\) remains parametrically finite and the suppression is
supplied by the common lower scale \((\rn/Q)^{q_i}\), not by requiring \(z\) itself to be small.'''
          new=r'''where \(G_i\) denotes the integral over \(z\) and the remaining radiation variables, including \(h_i\), and
\(z_{\max}\) is set jointly by the higher technical cut and the kinematic range. Uniform nested infrared
locality requires the underlying map mismatch to remain uniformly small over any finite allowed range of
\(z\). The function \(G_i\) should not, however, be understood as numerically of order one when
\(\rn/Q\to0\). At fixed order it can contain powers of the large logarithm
\begin{equation}
L_N=\ln\frac{Q}{\rn},
\label{eq:uniform-nested-large-log}
\end{equation}
inherited from the singular lower-resolution spectrum and, in the overlap with the strongly ordered region,
additional logarithms of neighboring resolution-scale ratios. Such logarithms can significantly enhance the
numerical size of the projection correction and can require resummation when the fixed-order logarithmic
expansion ceases to be well behaved. What uniform nested locality excludes is an additional \emph{inverse
power} of the common unresolved scale hidden inside \(G_i\). Consequently, for every finite logarithmic power
\(m\) and every \(q_i>0\),
\begin{equation}
\left(\frac{\rn}{Q}\right)^{q_i}L_N^m\longrightarrow0
\qquad (\rn/Q\to0).
\label{eq:power-beats-log}
\end{equation}
The logarithms can therefore modify the logarithmic structure of the \(\rn\) spectrum, but they cannot
compensate the positive-power suppression implied by nested locality. Parametrically the correction behaves
as \(\rn^{q_i-1}L_N^m\): for \(0<q_i<1\) it may still diverge as \(\rn\to0\), but only with an integrable
singularity and always less strongly than the leading \(1/\rn\) spectrum; for \(q_i=1\) at most a logarithmic
singularity remains, while for \(q_i>1\) the spectrum-level correction vanishes up to logarithms. An actual
power-like growth of \(G_i\) as \(\rn/Q\to0\) would instead signal that the assumed nested-local power counting
is incomplete, for example because an additional singular region has not been factorized.'''
          if t.count(old)!=1:
              raise SystemExit('Target paragraph after Eq.39 not found uniquely')
          p.write_text(t.replace(old,new,1))
          PY
          git add main.tex
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "Clarify logarithms in nested-local spectrum"
          EDIT_HEAD="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "EDIT_HEAD=$EDIT_HEAD" >> "$GITHUB_ENV"

      - name: Push clarification directly to Overleaf and update checkpoint
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/github-to-overleaf.patch"
          git diff --binary "$OVERLEAF_HEAD" "$EDIT_HEAD" -- . ':(exclude).github/**' > "$PATCH"
          git switch --detach "$OVERLEAF_HEAD"
          git apply --3way --index "$PATCH"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "Sync Eq.39 logarithm clarification"
          git push overleaf "HEAD:$OVERLEAF_BRANCH"
          NEW_OVERLEAF_HEAD="$(git rev-parse HEAD)"
          git switch -C main "$EDIT_HEAD"
          printf '%s\n' "$NEW_OVERLEAF_HEAD" > "$STATE_FILE"
          git add "$STATE_FILE"
          git commit -m "Update Overleaf sync checkpoint"
          git push origin HEAD:main
