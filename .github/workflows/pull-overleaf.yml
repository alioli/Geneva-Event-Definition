name: Pull changes from Overleaf

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pull-overleaf.yml'

permissions:
  contents: write

concurrency:
  group: overleaf-sync
  cancel-in-progress: false

env:
  OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
  OVERLEAF_REMOTE: https://git@git.overleaf.com/69ce2c30f9afe0bef5ae7ddf
  STATE_FILE: .github/overleaf-sync-state

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out GitHub main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Overleaf authentication
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OVERLEAF_TOKEN:-}" ]]; then
            echo "::error::Repository secret OVERLEAF_TOKEN is not configured."
            exit 1
          fi

          ASKPASS="$RUNNER_TEMP/overleaf-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'git' ;;
            *Password*) printf '%s\n' "$OVERLEAF_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          echo "GIT_ASKPASS=$ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Fetch current Overleaf state
        shell: bash
        run: |
          set -euo pipefail

          git remote add overleaf "$OVERLEAF_REMOTE"

          OVERLEAF_BRANCH="$({ git ls-remote --symref overleaf HEAD || true; } \
            | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')"

          if [[ -z "$OVERLEAF_BRANCH" ]]; then
            echo "::error::Could not determine the default branch of the Overleaf repository."
            exit 1
          fi

          git fetch --prune overleaf "$OVERLEAF_BRANCH"
          OVERLEAF_HEAD="$(git rev-parse "overleaf/$OVERLEAF_BRANCH")"

          echo "Using Overleaf branch: $OVERLEAF_BRANCH"
          echo "Current Overleaf commit: $OVERLEAF_HEAD"
          echo "OVERLEAF_BRANCH=$OVERLEAF_BRANCH" >> "$GITHUB_ENV"
          echo "OVERLEAF_HEAD=$OVERLEAF_HEAD" >> "$GITHUB_ENV"

      - name: Build Overleaf change patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/overleaf-to-github.patch"
          : > "$PATCH"

          if [[ -f "$STATE_FILE" ]]; then
            BASE_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"

            if [[ -z "$BASE_SHA" ]]; then
              echo "::error::The Overleaf sync checkpoint is empty."
              exit 1
            fi

            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "::error::The previous Overleaf checkpoint $BASE_SHA is not available in the fetched history."
              exit 1
            fi

            if ! git merge-base --is-ancestor "$BASE_SHA" "$OVERLEAF_HEAD"; then
              echo "::error::Overleaf history no longer descends from the stored checkpoint. Refusing to overwrite GitHub."
              exit 1
            fi

            if [[ "$BASE_SHA" != "$OVERLEAF_HEAD" ]]; then
              git diff --binary "$BASE_SHA" "$OVERLEAF_HEAD" -- . ':(exclude).github/**' > "$PATCH"
            fi
          else
            echo "No previous Overleaf checkpoint found; bootstrapping from the current trees."
            git diff --binary HEAD "$OVERLEAF_HEAD" -- . ':(exclude).github/**' > "$PATCH"
          fi

          if [[ ! -s "$PATCH" ]]; then
            echo "No project-file changes to import from Overleaf."
          fi

      - name: Apply Overleaf changes safely
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/overleaf-to-github.patch"

          if [[ -s "$PATCH" ]]; then
            if ! git apply --3way --index "$PATCH"; then
              echo "::error::Overleaf changes conflict with current GitHub main. Nothing was pushed to GitHub."
              git status --short
              exit 1
            fi
          fi

          mkdir -p "$(dirname "$STATE_FILE")"
          printf '%s\n' "$OVERLEAF_HEAD" > "$STATE_FILE"
          git add "$STATE_FILE"

          if git diff --cached --quiet; then
            echo "GitHub is already synchronized with Overleaf."
          else
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git commit -m "Sync changes from Overleaf"
            git push origin HEAD:main
          fi

      - name: Apply concise Z+1-jet note correction
        shell: bash
        run: |
          set -euo pipefail

          # Work from the just-synchronized GitHub state, including any
          # Overleaf edits imported by the previous step.
          git fetch origin main
          git switch main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path

          p = Path('main.tex')
          text = p.read_text()

          if 'eq:z1j-generation-cut' in text and 'eq:z1j-leading-jet-boundary' in text:
              print('Z+1-jet correction already present.')
              raise SystemExit(0)

          old_jet = r'''Jet observables introduce a second effect that is logically distinct from the locality of the projection map.
The $\mathcal T_1$ resolution variable is defined through its own exclusive clustering or minimization
procedure, whereas phenomenological observables are commonly constructed from inclusive anti-$k_T$ jets.
Consequently, exact preservation of $\mathcal T_1$ does not imply preservation of the anti-$k_T$ leading-jet
momentum or rapidity. Moreover, the anti-$k_T$ measurement contains non-smooth codimension-one surfaces,
including the analysis threshold
\begin{equation}
p_{T,j_1}=p_T^{\min},
\label{eq:z1j-jet-threshold-surface}
\end{equation}
clustering boundaries and changes in the identity of the leading jet. IRC safety ensures a well-defined
unresolved limit, but it does not make the differential response to a small projection displacement uniform
across such surfaces. For the threshold measurement one has distributionally
\begin{equation}
\Theta\!\left(\widehat p_{T,j_1}-p_T^{\min}\right)
-
\Theta\!\left(p_{T,j_1}-p_T^{\min}\right)
\simeq
-\Delta p_{T,j_1}\,
\delta\!\left(p_{T,j_1}-p_T^{\min}\right),
\label{eq:z1j-pt-threshold-migration}
\end{equation}
with the sign convention
$\Delta p_{T,j_1}=p_{T,j_1}(\Ph_3)-p_{T,j_1}(\widehat\Ph_2)$.
A steeply falling jet spectrum can therefore amplify a parametrically small kinematic migration into a
large relative change of a fiducial cross section.
'''

          new_jet = r'''Jet observables introduce a second effect that is logically distinct from the locality of the projection map.
The $\mathcal T_1$ resolution variable is defined through its own exclusive clustering or minimization,
whereas the analysis commonly uses inclusive anti-$k_T$ jets. The anti-$k_T$ measurement is only piecewise
smooth in phase space: the clustering history changes across boundaries where two candidate distances become
equal, for example $d_{ij}=d_{kB}$, while the identity of the leading jet changes across
\begin{equation}
p_{T,j_a}=p_{T,j_b}.
\label{eq:z1j-leading-jet-boundary}
\end{equation}
These are codimension-one boundaries, since one equality separates neighboring phase-space regions with
different clustering or jet ordering. IRC safety guarantees the correct soft and collinear limit, but not
uniform differentiability of the measurement across such boundaries.

A particularly relevant boundary is the analysis requirement $p_{T,j_1}>p_T^{\min}$. For the projection-induced
shift $\Delta p_{T,j_1}=p_{T,j_1}(\Ph_3)-p_{T,j_1}(\widehat\Ph_2)$ one has distributionally
\begin{equation}
\Theta\!\left(\widehat p_{T,j_1}-p_T^{\min}\right)
-
\Theta\!\left(p_{T,j_1}-p_T^{\min}\right)
\simeq
-\Delta p_{T,j_1}\,
\delta\!\left(p_{T,j_1}-p_T^{\min}\right).
\label{eq:z1j-pt-threshold-migration}
\end{equation}
Thus a parametrically small displacement can generate a sizeable relative correction when the jet spectrum
is steep or the event lies close to a clustering, ordering or acceptance boundary. This enhancement does not
by itself signal a failure of nested locality: for a smooth underlying distribution the phase-space layer
that changes classification still shrinks with the size of the displacement.
'''

          if old_jet not in text:
              raise SystemExit('Expected anti-kT paragraph not found; refusing to edit.')
          text = text.replace(old_jet, new_jet, 1)

          anchor = r'''At larger $m_T^Z$ the ratio in Eq.~\eqref{eq:z1j-cut-ratio} decreases and the higher cut enforces a progressively
stronger restriction on $z$ already near the lower boundary.
'''

          generation = anchor + r'''
The event sample is defined with the generation cut
\begin{equation}
q_T>q_T^{\rm gen}=10^{-3}\ {\rm GeV}.
\label{eq:z1j-generation-cut}
\end{equation}
Both the FKS and the $\mathcal T_1^{\rm FR}$ mappings considered here preserve $q_T$, and therefore preserve
this process-defining boundary exactly. The observed LHE differences cannot consequently be attributed to a
migration across the generation cut; the non-preservation of $\mathcal T_0$ by the $\mathcal T_1^{\rm FR}$ map
is relevant instead as a diagnostic of motion along the limiting one-jet Born manifold.
'''

          if anchor not in text:
              raise SystemExit('Expected cut-hierarchy anchor not found; refusing to edit.')
          text = text.replace(anchor, generation, 1)

          old_obs = r'''This observation is useful when interpreting the numerically large LHE projection effects found in observables
involving the hardest anti-$k_T$ jet, including analyses with $p_{T,j}^{\min}=10$, $50$ and $100$ GeV.
Differences at the level of tens of percent cannot be attributed solely to a parametrically huge ratio of the
technical cuts. They may instead arise from one or a combination of three effects: a genuine failure of
uniform nested locality in tangential one-jet Born coordinates; a nested-local but slowly convergent recoil
map; or amplification of a small kinematic displacement by the steep jet spectrum and the non-smooth
anti-$k_T$ measurement boundaries.

The most direct diagnostic is to apply the competing $\Ph_3\to\Ph_2$ projections, for example an FKS map
and the $\mathcal T_1^{\rm FR}$ map, to the same exact $\Ph_3$ points and study, in bins of
'''

          new_obs = r'''The direct comparison of mappings is particularly informative. For
$\mathcal T_2^{\cut}=10^{-3}\ {\rm GeV}$ the LHE differences obtained with the FKS mapping are much smaller than
those obtained with the $\mathcal T_1^{\rm FR}$ mapping for observables involving the hardest anti-$k_T$ jet,
including analyses with $p_{T,j}^{\min}=10$, $50$ and $100$ GeV. For both mappings the differences grow when
$\mathcal T_2^{\cut}$ is increased, becoming much larger for $\mathcal T_2^{\cut}=1\ {\rm GeV}$, but the
$\mathcal T_1^{\rm FR}$ residual remains substantially larger even at the smallest cut. Since the two mappings
are exposed to the same anti-$k_T$ clustering and threshold boundaries and preserve the same generation cut,
this shows that the large residual is map dependent. The jet measurement can amplify the migration, but cannot
by itself be its primary origin.

This pattern does not yet establish a formal failure of uniform nested infrared locality. The
$\mathcal T_1^{\rm FR}$ map could instead be nested-local with a larger coefficient or a slower approach to the
simultaneous unresolved limit than FKS. The decisive next test is therefore local: apply both projections to
the same exact $\Ph_3$ configurations and study, in bins of
'''

          if old_obs not in text:
              raise SystemExit('Expected Z+1-jet interpretation paragraph not found; refusing to edit.')
          text = text.replace(old_obs, new_obs, 1)

          p.write_text(text)
          PY

          if git diff --quiet -- main.tex; then
            echo "No Z+1-jet text changes to commit."
            echo "Z1JET_PATCH_COMMIT=" >> "$GITHUB_ENV"
            exit 0
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add main.tex
          git commit -m "Clarify jet-boundary response in Z+1-jet example"
          Z1JET_PATCH_COMMIT="$(git rev-parse HEAD)"
          echo "Z1JET_PATCH_COMMIT=$Z1JET_PATCH_COMMIT" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Sync Z+1-jet correction directly to Overleaf
        if: env.Z1JET_PATCH_COMMIT != ''
        shell: bash
        run: |
          set -euo pipefail

          PATCH_COMMIT="$Z1JET_PATCH_COMMIT"
          BASE_COMMIT="$(git rev-parse "${PATCH_COMMIT}^")"
          git diff --binary "$BASE_COMMIT" "$PATCH_COMMIT" -- main.tex > "$RUNNER_TEMP/z1jet-note.patch"

          git fetch --prune overleaf "$OVERLEAF_BRANCH"
          git switch --detach "overleaf/$OVERLEAF_BRANCH"

          if ! git apply --3way --index "$RUNNER_TEMP/z1jet-note.patch"; then
            echo "::error::The Z+1-jet correction conflicts with newer Overleaf edits. Nothing was pushed to Overleaf."
            git status --short
            exit 1
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "Sync Z+1-jet note correction ${PATCH_COMMIT::12}"
          git push overleaf "HEAD:$OVERLEAF_BRANCH"
          NEW_OVERLEAF_HEAD="$(git rev-parse HEAD)"

          git switch main
          git fetch origin main
          git reset --hard origin/main
          printf '%s\n' "$NEW_OVERLEAF_HEAD" > "$STATE_FILE"
          git add "$STATE_FILE"
          git commit -m "Sync changes from Overleaf"
          git push origin HEAD:main
