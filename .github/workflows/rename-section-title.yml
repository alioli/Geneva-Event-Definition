name: Rename section title

on:
  push:
    branches:
      - main
    paths:
      - '.github/rename-section-title-trigger'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('main.tex')
          t = p.read_text()
          old = r'\section{How a higher cut can contaminate a lower singular spectrum}'
          new = r'\section{Impact of the higher-multiplicity \texorpdfstring{$r_{N+1}^{\rm cut}$}{rN+1cut} projection on the lower-multiplicity \texorpdfstring{$r_N$}{rN} singular spectrum}'
          if t.count(old) != 1:
              raise SystemExit(f'expected exactly one title to replace, found {t.count(old)}')
          p.write_text(t.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add main.tex
          git commit -m "Clarify higher-cut singular-spectrum title"
          git push origin HEAD:main
